name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch CH340 driver installer (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $tmp = Join-Path $env:RUNNER_TEMP "vendor"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          try {
            Invoke-WebRequest "https://www.farnell.com/software/4437818.zip" -OutFile "$tmp\vendor.zip" -UserAgent $ua
            Expand-Archive "$tmp\vendor.zip" "$tmp\x" -Force
            # the vendor zip has zips inside zips
            for ($n = 0; $n -lt 3; $n++) {
              Get-ChildItem "$tmp\x" -Recurse -Filter *.zip | ForEach-Object {
                Expand-Archive $_.FullName (Join-Path $_.DirectoryName $_.BaseName) -Force -ErrorAction SilentlyContinue
                Remove-Item $_.FullName
              }
            }
            $exe = Get-ChildItem "$tmp\x" -Recurse -Include "CH34*.exe","CH341SER*.exe" | Select-Object -First 1
            if ($exe) { Copy-Item $exe.FullName drivers\ ; Write-Host "Bundled driver: $($exe.Name)" }
            else { Write-Host "No CH34x installer found in vendor zip" }
          } catch { Write-Host "Driver fetch failed: $_ (app will link to WCH instead)" }

      - name: Stamp build number
        shell: pwsh
        run: |
          '{"build": ${{ github.run_number }}, "sha": "${{ github.sha }}"}' | Out-File -Encoding ascii app\build_info.json

      - name: Build
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name "PSU-Studio" `
            --add-data "app\web;web" --add-data "drivers;drivers" --add-data "app\build_info.json;." `
            --paths app --hidden-import device --hidden-import driver --hidden-import importers --hidden-import updater `
            app\psu_studio.py
          Get-Item dist\PSU-Studio.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PSU-Studio.exe

  linux:
    # oldest supported runner = oldest glibc, so the binary runs on more distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp build number
        run: |
          echo '{"build": ${{ github.run_number }}, "sha": "${{ github.sha }}"}' > app/build_info.json

      - name: Build
        run: |
          # no pywebview on Linux: the app serves its UI to a Chrome/Chromium app window or the default browser
          python -m pip install pyserial openpyxl pyinstaller
          python -m PyInstaller --noconfirm --onefile --name "PSU-Studio-linux-x86_64" \
            --add-data "app/web:web" --add-data "app/build_info.json:." \
            --paths app --hidden-import device --hidden-import driver --hidden-import importers --hidden-import updater \
            --exclude-module pandas --exclude-module numpy --exclude-module tkinter --exclude-module webview \
            app/psu_studio.py
          ls -la dist/

      - name: Smoke test
        run: |
          ./dist/PSU-Studio-linux-x86_64 --sim --no-open &
          PID=$!
          for i in $(seq 1 30); do curl -sf -X POST -d '[]' http://127.0.0.1:8765/api/info && break; sleep 1; done
          echo
          curl -sf http://127.0.0.1:8765/index.html | grep -q "PSU Studio"
          curl -sf -X POST -d '[]' http://127.0.0.1:8765/api/auto_connect | grep -q '"ok": true'
          sleep 1
          curl -sf -X POST -d '[0]' http://127.0.0.1:8765/api/get_state | grep -q '"connected": true'
          kill $PID
          echo "smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/PSU-Studio-linux-x86_64

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Restore executable bit
        run: chmod +x out/linux/PSU-Studio-linux-x86_64 && ls -laR out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PSU Studio build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            PSU Studio build ${{ github.run_number }} from ${{ github.sha }}.

            - **Windows:** download **PSU-Studio.exe** and double-click it. No install needed.
            - **Linux (x86_64):** download **PSU-Studio-linux-x86_64**, then `chmod +x PSU-Studio-linux-x86_64 && ./PSU-Studio-linux-x86_64`.
          files: |
            out/windows/PSU-Studio.exe
            out/linux/PSU-Studio-linux-x86_64
